name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mi-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
